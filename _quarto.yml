project:
  type: website
  output-dir: _site
  render: ["*.qmd"]
  resources: ["assets/**"]

website:
  title: "Adnan Ghribi"
  site-url: https://aghribi.github.io
  navbar:
    left:
      - href: projects.qmd
        text: Projects
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: talks.qmd
        text: Talks
      - href: teaching.qmd
        text: Teaching
    right:
      - icon: github
        href: https://github.com/aghribi
        aria-label: GitHub
      - text: ORCID
        href: https://orcid.org/0000-0001-9634-4526
      - text: INSPIRE
        href: https://inspirehep.net/authors/1245936
  page-footer:
    center: "© Adnan Ghribi. Lists built from INSPIRE, ORCID, Crossref, DataCite, CERN Indico, theses.fr and GitHub."

format:
  html:
    lang: en
    theme:
      dark: [darkly, theme.scss, dark.scss]
      light: [cosmo, theme.scss, light.scss]
    include-before-body:
      text: '<a class="skip-link" href="#quarto-document-content">Skip to content</a>'
    include-after-body:
      text: '<script src="assets/fx.js" defer></script>'
    toc: false
    anchor-sections: false
