website:
  title: "Adnan Ghribi"
  site-url: https://aghribi.github.io
  navbar:
    left:
      - href: projects.qmd
        text: Projects
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: talks.qmd
        text: Talks
      - href: teaching.qmd
        text: Teaching
    right:
      - icon: github
        href: https://github.com/aghribi
        aria-label: GitHub
      - text: ORCID
        href: https://orcid.org/0000-0001-9634-4526
