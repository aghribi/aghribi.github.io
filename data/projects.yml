- title: iRIS, work package GreenBeam
  role: Work package leader
  summary: AI methods to cut the energy and resource use of particle accelerators. Surrogate models from operational beam data, embedded in design and optimisation tools, and audits of hidden energy losses. With CERN, GSI, Heriot-Watt and Liverpool.
  categories: [Coordination]
  status: Signed
  period: 2026 to 2030
  tags: [Horizon Europe, sustainability, FCC]
  featured: lead
  links:
    - {label: CORDIS, url: "https://cordis.europa.eu/project/id/101275935"}
