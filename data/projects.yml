- title: TwinRISE
  role: Coordinator
  summary: European reference framework for trusted AI-generated digital twins across research, healthcare and energy infrastructures. Distributed, AI-native digital twin engine.
  categories: [Coordination]
  status: Signed
  period: 2027 to 2030
  tags: [Horizon Europe, digital twins, trusted AI]
  featured: lead
